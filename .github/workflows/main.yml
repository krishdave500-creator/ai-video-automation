name: AI YouTube Automation Test

on:
  workflow_dispatch:

jobs:
  youtube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate AI Topic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          api_key = os.environ["GEMINI_API_KEY"]

          prompt = """
          Generate ONE highly interesting YouTube Shorts topic.
          Topic must be suitable for a faceless AI YouTube channel.
          Make it educational, curiosity-driven and suitable for mass audience.
          Return ONLY the topic, no explanation.
          """

          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent"

          response = requests.post(
              url,
              params={"key": api_key},
              json={
                  "contents": [
                      {
                          "parts": [
                              {"text": prompt}
                          ]
                      }
                  ]
              },
              timeout=60
          )

          response.raise_for_status()

          data = response.json()
          topic = data["candidates"][0]["content"]["parts"][0]["text"].strip()

          with open("topic.txt", "w", encoding="utf-8") as f:
              f.write(topic)

          print("AI TOPIC:", topic)
          PY

      - name: Restore YouTube Token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          test -n "$YOUTUBE_TOKEN_JSON"
          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json

      - name: Create YouTube Client Secrets
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import os
          import json

          data = {
              "installed": {
                  "client_id": os.environ["YOUTUBE_CLIENT_ID"],
                  "client_secret": os.environ["YOUTUBE_CLIENT_SECRET"],
                  "auth_uri": "https://accounts.google.com/o/oauth2/auth",
                  "token_uri": "https://oauth2.googleapis.com/token",
                  "redirect_uris": ["http://localhost"]
              }
          }

          with open("client_secrets.json", "w") as f:
              json.dump(data, f)
          PY

      - name: Run AI YouTube Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          TOPIC="$(cat topic.txt)"
          python main.py "$TOPIC" short true private
